name: Modern Killer Launcher

on:
  push:
    branches: [ modern-client ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-killer-launcher
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          dotnet publish Saradomin/Saradomin.csproj `
            --runtime win-x64 `
            --self-contained `
            -c Release `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true 2>&1 | Tee-Object -FilePath modern-launcher-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $out = "Saradomin/bin/Release/net10.0/win-x64/publish/Saradomin.exe"
          if (!(Test-Path $out)) { throw "Launcher executable was not produced." }
          $exe = "$env:RUNNER_TEMP/OSRS-Client-Killer-Edition-Launcher.exe"
          $zip = "$env:RUNNER_TEMP/OSRS-Client-Killer-Edition-Launcher_beta1.zip"
          Copy-Item $out $exe
          Compress-Archive -Path $exe -DestinationPath $zip -Force

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modern-launcher-build-log
          path: modern-launcher-build.log

      - name: Upload preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: OSRS-Client-Killer-Edition-Launcher
          path: |
            ${{ runner.temp }}/OSRS-Client-Killer-Edition-Launcher.exe
            ${{ runner.temp }}/OSRS-Client-Killer-Edition-Launcher_beta1.zip
          if-no-files-found: error

      - name: Publish rolling preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modern-launcher-latest
          name: OSRS Client Killer Edition - Launcher Preview
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/OSRS-Client-Killer-Edition-Launcher.exe
          body: |
            Rolling launcher preview for the modern revision-530 Killer client.
            The launcher downloads modern-client-latest and manages one JAR per client plugin.

      - name: Publish Beta 1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modern-launcher-beta.1
          name: OSRS Client Killer Edition Launcher - Beta 1
          prerelease: true
          make_latest: false
          files: |
            ${{ runner.temp }}/OSRS-Client-Killer-Edition-Launcher.exe
            ${{ runner.temp }}/OSRS-Client-Killer-Edition-Launcher_beta1.zip
          body: |
            Beta 1 checkpoint of the modern Killer Edition launcher.

            Windows x64 self-contained build for testing with the modern revision-530 Killer client.
            The rolling preview channel remains available separately for automatic update testing.
